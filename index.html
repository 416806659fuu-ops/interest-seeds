<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#eae9e9">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>興味の種 スマホ版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@400;600&family=Noto+Serif+JP:wght@400;600&display=swap">
<style>
/* Broadsheet tokens (Claude Design handoff v1.3) — single-theme paper design */
:root{
  --color-bg:#f3f2f2;
  --color-surface:#eae9e9;
  --color-text:#201e1d;
  --color-accent:#0088b0;
  --color-accent-700:#006786;
  --color-accent-2:#d6006c;
  --color-process-yellow:#edbb00;
  --color-neutral-200:#eae7e7;
  /* six interests = three process inks + their three overprints */
  --cat-boulder:#0088b0;  /* C   */
  --cat-cook:#edbb00;     /* Y   */
  --cat-ceramic:#d6006c;  /* M   */
  --cat-garden:#2e9a52;   /* C+Y */
  --cat-photo:#4b4fa0;    /* C+M */
  --cat-music:#e5452b;    /* M+Y */
  --space-3:15px;
  --space-6:30px;
  --radius-lg:4px;
  --shadow-md:0 3px 10px color-mix(in srgb,#2d2b2b 16%,transparent);
  --shadow-lg:0 12px 32px color-mix(in srgb,#2d2b2b 22%,transparent);
  --serif:"Source Serif 4","Noto Serif SC","Noto Serif JP","Songti SC",serif;
  --serif-jp:"Source Serif 4","Noto Serif JP","Noto Serif SC","Hiragino Mincho ProN",serif;
  --muted:color-mix(in srgb,var(--color-text) 70%,transparent);
  --faint:color-mix(in srgb,var(--color-text) 62%,transparent);
  --hair:color-mix(in srgb,var(--color-text) 22%,transparent);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--color-bg);color:var(--color-text)}
body{font-family:var(--serif);overflow-x:hidden}
[hidden]{display:none!important}
button{font:inherit;color:inherit}

.page{
  min-height:100vh;min-height:100dvh;display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:88px;padding:64px 40px;
}
@media (max-width:600px){.page{gap:36px;padding:56px 16px 40px}}
.intro{max-width:330px;display:flex;flex-direction:column;gap:var(--space-6)}
.intro .top{display:flex;flex-direction:column;gap:var(--space-3)}
.kicker{font-size:12px;letter-spacing:.14em;color:var(--color-accent-700)}
h1{margin:0;font-size:44px;line-height:1.1;font-weight:600;letter-spacing:0}
.intro p{margin:0;font-size:15px;line-height:1.8;text-wrap:pretty}
.prog{display:flex;flex-direction:column;gap:12px}
.prow{display:grid;grid-template-columns:10px 40px 58px 1fr auto;align-items:center;gap:10px;font-size:14px}
.prow .sw{width:10px;height:10px;border-radius:50%}
.prow b{font-weight:600}
.dots{display:flex;gap:5px}
.dot{width:8px;height:8px;border-radius:50%;border:1px solid color-mix(in srgb,var(--color-text) 35%,transparent)}
.dot.on{background:var(--color-text);border-color:var(--color-text)}
.plab{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.plus{background:none;border:0;padding:2px 0 2px 6px;font-size:12px;color:var(--color-accent-700);cursor:pointer;font-family:var(--serif)}
.plus:hover{text-decoration:underline}
.plus:disabled{color:var(--hair);cursor:default;text-decoration:none}
.plus:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
.hint{font-size:13px;line-height:1.9;color:var(--muted)}

.ver{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:16px;z-index:20}
.ver select{font-family:var(--serif);font-size:12px;color:var(--muted);background:transparent;border:1px solid var(--hair);border-radius:var(--radius-lg);padding:4px 8px;cursor:pointer}
.ver select:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}

/* ---------- phone column ---------- */
.pcol{display:flex;flex-direction:column;align-items:center;gap:6px}
.apps{display:flex;gap:18px;font-size:13px}
.apps button{background:none;border:0;padding:4px 0;cursor:pointer;color:var(--muted);border-bottom:1px solid transparent}
.apps button[aria-pressed="true"]{color:var(--color-text);border-bottom-color:var(--color-text);font-weight:600}
.apps button:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
.wrap{cursor:grab;touch-action:none}
.box{display:flex;align-items:center;justify-content:center}
.phone{flex-shrink:0;width:344px;height:720px;padding:12px;border-radius:52px;background:var(--color-text);box-sizing:content-box;will-change:transform}
.screen{position:relative;width:100%;height:100%;border-radius:40px;overflow:hidden;background:var(--color-surface);cursor:default;touch-action:pan-y}

/* ---------- inside the screen ---------- */
.head{position:absolute;top:0;left:0;right:0;z-index:3;background:var(--color-surface);font-family:var(--serif-jp)}
.sbar{height:34px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 28px;font-size:13px;font-weight:600;font-family:"Source Serif 4",serif}
.sbar i{width:84px;height:24px;border-radius:14px;background:var(--color-text);align-self:center;margin-top:10px}
.hrow{display:flex;align-items:center;justify-content:space-between;padding:12px 18px 10px}
.hrow .t{font-size:20px;font-weight:600}
.tog{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13px;user-select:none;background:none;border:0;padding:0}
.tog:focus-visible{outline:2px solid var(--color-accent);outline-offset:3px;border-radius:4px}
.track{width:34px;height:20px;border-radius:10px;background:var(--color-accent);display:flex;align-items:center;justify-content:flex-end;padding:2px}
.tog[aria-pressed="false"] .track{background:var(--hair);justify-content:flex-start}
.knob{width:16px;height:16px;border-radius:50%;background:var(--color-bg)}

.feed{position:absolute;inset:0;overflow-y:auto;padding:94px 0 24px;scrollbar-width:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:var(--serif-jp)}
.feed::-webkit-scrollbar{display:none}
.halftone{background-color:var(--color-neutral-200);background-image:radial-gradient(color-mix(in srgb,var(--color-text) 16%,transparent) 1px,transparent 1.4px);background-size:5px 5px}
.ctag{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--faint)}
.ctag i{width:6px;height:6px;border-radius:50%;display:block}

/* Instagram-style scroll feed */
.ig{background:var(--color-bg);margin-bottom:10px;cursor:pointer}
.ig .ph{display:flex;align-items:center;gap:9px;padding:10px 12px}
.ig .av{width:28px;height:28px;border-radius:50%;flex:none;border:1.5px solid var(--color-bg);box-shadow:0 0 0 1.5px var(--av)}
.ig .un{font-size:12.5px;font-weight:600;line-height:1.2}
.ig .un small{display:flex;font-weight:400;margin-top:2px}
.ig .more{margin-left:auto;font-size:15px;color:var(--faint);letter-spacing:1px}
.ig .pic{aspect-ratio:4/5;width:100%}
.ig .acts{display:flex;align-items:center;gap:14px;padding:9px 12px 4px}
.ig .acts svg{width:22px;height:22px;display:block}
.ig .acts .bm{margin-left:auto}
.ig .like{background:none;border:0;padding:0;cursor:pointer;display:block}
.ig .like[aria-pressed="true"] path{fill:var(--color-accent-2);stroke:var(--color-accent-2)}
.ig .cnt{font-size:12px;font-weight:600;padding:2px 12px}
.ig .cap{font-size:12.5px;line-height:1.55;padding:2px 12px}
.ig .cap b{font-weight:600;margin-right:5px}
.ig .tm{font-size:10.5px;color:var(--faint);padding:4px 12px 12px}

/* Xiaohongshu-style two-column notes (Claude Design v1.3 cards) */
.cols{columns:2;column-gap:8px;padding:0 10px}
.card{break-inside:avoid;margin-bottom:8px;background:var(--color-bg);border-radius:var(--radius-lg);overflow:hidden;cursor:pointer}
.cbody{padding:8px 10px 10px;display:flex;flex-direction:column;gap:6px}
.ctitle{font-size:13px;line-height:1.45;font-weight:600;text-wrap:pretty}
.cmeta{font-size:11px;color:var(--faint);display:flex;justify-content:space-between;align-items:center}
.nl{background:none;border:0;padding:0;cursor:pointer;color:var(--faint);font-size:11px}
.nl[aria-pressed="true"]{color:var(--color-accent-2)}

.seen-mark{outline:1px solid color-mix(in srgb,var(--color-text) 30%,transparent);outline-offset:-1px}

.layer{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden;transition:opacity .4s}
.plants{position:absolute;inset:0;width:100%;height:100%;z-index:4;pointer-events:none;overflow:visible;transition:opacity .4s}
.plants .hit{pointer-events:auto;fill:transparent;cursor:pointer}
.plants .stem{fill:none;stroke:#3F7F3A;stroke-width:2.6;stroke-linecap:round}
.plants .lf{fill:#6FA65B;stroke:var(--color-text);stroke-width:.8}
.plants .root{stroke:var(--color-text);stroke-width:1.4;fill:none;opacity:.55}
.plants .core{fill:var(--color-text)}
.plants g.grow{animation:pgrow .42s ease-out}
@keyframes pgrow{0%{transform:scale(.92)}50%{transform:scale(1.06)}100%{transform:scale(1)}}
.plants g.grow{transform-box:fill-box;transform-origin:50% 100%}

.toast{position:absolute;left:50%;top:100px;z-index:9;transform:translate(-50%,-6px);background:var(--color-text);color:var(--color-bg);font-size:11.5px;padding:6px 12px;border-radius:14px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;white-space:nowrap;max-width:300px;overflow:hidden;text-overflow:ellipsis;font-family:var(--serif-jp)}
.toast[data-on="1"]{opacity:1;transform:translate(-50%,0)}

/* bloom card (v1.3 visual, v1.2 content) */
.bloom{position:absolute;left:12px;right:12px;bottom:14px;z-index:7;background:var(--color-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:16px 16px 12px;display:grid;grid-template-columns:60px 1fr;gap:12px 14px;align-items:start;font-family:var(--serif-jp)}
.bloom .art{width:60px;height:72px}
.bloom .h{font-size:12px;color:var(--muted)}
.bloom .s{font-size:16px;font-weight:600;line-height:1.3;margin-top:2px}
.bloom ul{list-style:none;margin:8px 0 0;padding:0;font-size:12px}
.bloom li{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid var(--hair)}
.bloom li small{color:var(--faint)}
.bloom .acts{grid-column:1 / -1;display:flex;gap:16px;justify-content:flex-end;font-size:12.5px}
.bloom .acts button{background:none;border:0;padding:4px 0;cursor:pointer;color:var(--muted)}
.bloom .acts .go{color:var(--color-accent-700);font-weight:600}
.bloom .acts button:focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}

/* my collection sheet */
.sheet{position:absolute;left:0;right:0;bottom:0;top:30%;z-index:8;background:var(--color-bg);box-shadow:var(--shadow-lg);border-radius:18px 18px 40px 40px;padding:12px 18px 18px;display:flex;flex-direction:column;gap:10px;transform:translateY(104%);transition:transform .42s cubic-bezier(.32,1,.3,1);font-family:var(--serif-jp)}
.sheet[data-on="1"]{transform:none}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--hair);margin:0 auto 4px}
.sheet h4{margin:0;font-size:15px;font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
.sheet h4 small{font-size:11px;font-weight:400;color:var(--faint)}
.sheet .x{position:absolute;right:16px;top:12px;background:none;border:0;cursor:pointer;font-size:14px;color:var(--faint);padding:4px}
.sheet .list{overflow-y:auto;scrollbar-width:none;display:flex;flex-direction:column}
.srow{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--hair)}
.srow .form{font-size:11px;text-align:center;border:1px solid;border-radius:3px;padding:2px 0}
.srow b{display:block;font-size:13px;font-weight:600}
.srow small{font-size:10.5px;color:var(--faint);font-family:"Source Serif 4",serif;font-style:italic}
.srow .st{font-size:11px;color:var(--muted)}
.sheet .foot{font-size:10.5px;color:var(--faint);border-top:1px solid var(--hair);padding-top:8px}

/* in-app title dropdown: seed stats + app switch */
.ttl{display:flex;align-items:center;gap:6px;background:none;border:0;padding:0;cursor:pointer;font-size:20px;font-weight:600;font-family:var(--serif-jp)}
.ttl .car{font-size:11px;transition:transform .25s}
.ttl[aria-expanded="true"] .car{transform:rotate(180deg)}
.ttl:focus-visible{outline:2px solid var(--color-accent);outline-offset:3px;border-radius:4px}
.drop{position:absolute;left:10px;right:10px;top:calc(var(--headh,94px) - 4px);z-index:8;background:var(--color-bg);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);padding:12px 14px 10px;font-family:var(--serif-jp);transform-origin:top center;animation:dropin .22s ease-out}
@keyframes dropin{from{opacity:0;transform:translateY(-6px) scaleY(.96)}to{opacity:1;transform:none}}
.drop .dh{display:flex;justify-content:space-between;align-items:baseline;font-size:11px;color:var(--faint);margin-bottom:6px}
.drop .apps2{display:flex;gap:16px;font-size:12.5px;padding:2px 0 8px;border-bottom:1px solid var(--hair);margin-bottom:6px}
.drop .apps2 button{background:none;border:0;padding:2px 0;cursor:pointer;color:var(--muted);border-bottom:1px solid transparent}
.drop .apps2 button[aria-pressed="true"]{color:var(--color-text);border-bottom-color:var(--color-text);font-weight:600}
.drop .prow{grid-template-columns:10px 1fr auto auto;gap:9px;padding:6px 0;font-size:13px}
.drop .prow .nm b{display:block;font-weight:600;font-size:12.5px}
.drop .prow .nm span{display:block;font-size:10.5px;color:var(--faint);margin-top:1px}
.drop .sens{display:block;width:100%;margin-top:8px;background:none;border:1px solid var(--hair);border-radius:var(--radius-lg);padding:7px;font-size:12px;cursor:pointer;color:var(--color-accent-700)}

/* interest sheet: page 1 = related posts, swipe left → page 2 = seed collection */
.sheet .tabs{display:flex;gap:18px;font-size:12.5px}
.sheet .tabs button{background:none;border:0;padding:2px 0;cursor:pointer;color:var(--muted);border-bottom:1px solid transparent}
.sheet .tabs button[aria-selected="true"]{color:var(--color-text);border-bottom-color:var(--color-text);font-weight:600}
.pages{flex:1;min-height:0;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pages::-webkit-scrollbar{display:none}
.pg{flex:0 0 100%;min-width:0;scroll-snap-align:start;overflow-y:auto;scrollbar-width:none;padding-right:2px}
.pg::-webkit-scrollbar{display:none}
.ihead{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;padding:4px 0 10px}
.ihead .sd{width:52px;height:52px}
.ihead b{display:block;font-size:16px;font-weight:600}
.ihead span{display:block;font-size:11px;color:var(--faint)}
.rec{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--hair);cursor:pointer}
.rec .th{width:48px;height:48px;border-radius:3px}
.rec b{display:block;font-size:12.5px;font-weight:600;line-height:1.4}
.rec small{font-size:10.5px;color:var(--faint)}
.pgdots{display:flex;justify-content:center;gap:6px;padding-top:6px}
.pgdots i{width:6px;height:6px;border-radius:50%;background:var(--hair)}
.pgdots i.on{background:var(--color-text)}
.srow .sd{width:36px;height:36px}
.srow .sd.dim{opacity:.25;filter:grayscale(1)}

/* ---------- phone-only mode (QR / mobile web) ---------- */
html:has(body.mobile),body.mobile{height:100%;overflow:hidden;overscroll-behavior:none}
body.mobile{position:fixed;inset:0}
body.mobile .ver,body.mobile .intro,body.mobile .apps{display:none}
body.mobile .page{padding:0;gap:0;min-height:0;display:block}
body.mobile .pcol{display:block}
body.mobile .wrap{padding:0!important;cursor:default}
body.mobile .box{width:100vw!important;height:100vh!important;height:100dvh!important;display:block}
body.mobile .phone{width:100vw;height:100vh;height:100dvh;padding:0;border-radius:0;box-sizing:border-box;transform:none!important}
body.mobile .screen{border-radius:0}
body.mobile .sbar{display:none}
body.mobile .head{padding-top:env(safe-area-inset-top,0px)}
body.mobile .feed{padding-top:var(--headh,60px)}
body.mobile .sheet{border-radius:18px 18px 0 0;padding-bottom:calc(18px + env(safe-area-inset-bottom,0px))}
body.mobile .bloom{bottom:calc(14px + env(safe-area-inset-bottom,0px))}

.screen,.screen *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
/* 2) tap marker for testing: translucent grey dot that follows the finger */
.tapdot{position:fixed;left:0;top:0;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;background:rgba(32,30,29,.16);border:1px solid rgba(32,30,29,.28);pointer-events:none;z-index:99;opacity:0;transform:scale(.6);transition:opacity .18s,transform .18s}
.tapdot.on{opacity:1;transform:scale(1)}
@media (min-width:600px){body.mobile .box{width:430px!important;margin:0 auto} body.mobile .phone{width:430px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>




<div class="page">
  <div class="pcol">
    <div class="apps" role="group" aria-label="デモ用アプリ">
      <button type="button" id="aScroll" aria-pressed="true">フィード</button>
      <button type="button" id="aNote" aria-pressed="false">ノート</button>
    </div>
    <div class="wrap" id="wrap">
      <div class="box" id="box">
        <div class="phone" id="phone">
          <div class="screen" id="screen">
            <div class="head">
              <div class="sbar"><span>9:41</span><i></i><span>100%</span></div>
              <div class="hrow">
                <button type="button" class="ttl" id="ttl" aria-expanded="false" aria-controls="drop"><span id="appTitle">ホーム</span><span class="car" aria-hidden="true">▾</span></button>
                <button type="button" class="tog" id="tog" aria-pressed="true">
                  <span id="togl">種 · ON</span><span class="track"><span class="knob"></span></span>
                </button>
              </div>
            </div>
            <div class="drop" id="drop" hidden>
              <div class="apps2" role="group" aria-label="アプリ">
                <button type="button" data-app="scroll" aria-pressed="true">フィード</button>
                <button type="button" data-app="note" aria-pressed="false">ノート</button>
              </div>
              <div class="dh"><span>種の記録</span><span id="dTotal">0 件</span></div>
              <div class="prog" id="prog"></div>
              <button type="button" class="sens" id="sens" hidden>重力センサーをオンにする</button>
            </div>
            <div class="feed" id="fScroll"></div>
            <div class="feed" id="fNote" hidden><div class="cols" id="cols"></div></div>
            <svg class="plants" id="plants" aria-hidden="true"></svg>
            <div class="layer" id="layer"></div>
            <div class="toast" id="toast"></div>

            <div class="bloom" id="bloom" hidden>
              <span class="art" id="bloomArt"></span>
              <span>
                <span class="h" id="bH"></span>
                <span class="s" id="bS" style="display:block"></span>
                <ul id="bList"></ul>
              </span>
              <span class="acts">
                <button type="button" id="bOff">この入口を OFF</button>
                <button type="button" id="bX">閉じる</button>
                <button type="button" class="go" id="bGo">見る</button>
              </span>
            </div>

            <div class="sheet" id="sheet">
              <button type="button" class="x" id="sheetX" aria-label="閉じる">✕</button>
              <div class="grab"></div>
              <div class="tabs" role="tablist">
                <button type="button" role="tab" aria-selected="true" data-pg="0">おすすめ</button>
                <button type="button" role="tab" aria-selected="false" data-pg="1">図鑑</button>
              </div>
              <div class="pages" id="pages">
                <section class="pg" id="pgRec" aria-label="この興味のおすすめ"></section>
                <section class="pg" id="pgCol" aria-label="種の図鑑"></section>
              </div>
              <div class="pgdots" aria-hidden="true"><i class="on"></i><i></i></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

function plantMarkup(k,x,base,n){
  var grow=Math.max(0,Math.min(1,(n-MILES.settle)/(MILES.bloom-MILES.settle)));
  var h=22+grow*96, ly=base-h*0.55;
  return '<path class="root" d="M'+(x-7)+' '+(base+2)+' q -6 7 -9 13 M'+(x+7)+' '+(base+2)+' q 6 7 9 13 M'+x+' '+(base+3)+' v 12"/>'+

    (n>=MILES.leaf ? '<path class="lf" d="M'+x+' '+ly+' C '+(x-18)+' '+(ly-3)+' '+(x-27)+' '+(ly-13)+' '+(x-28)+' '+(ly-24)+' C '+(x-13)+' '+(ly-26)+' '+(x-2)+' '+(ly-13)+' '+x+' '+ly+' Z"/>' : '')+

}
function plantTopY(k){ var n=st[k].n; var g=Math.max(0,Math.min(1,(n-MILES.settle)/(MILES.bloom-MILES.settle))); return baseY()-(22+g*96); }
function baseY(){ return layer.clientHeight-16; }
function slotX(k){ var i=slots.indexOf(k); return 32+i*56; }

function drawPlants(growK){
  var W=layer.clientWidth, H=layer.clientHeight;
  psvg.setAttribute('viewBox','0 0 '+W+' '+H);
  psvg.textContent='';
  slots.forEach(function(k){
    var x=slotX(k), b=baseY(), n=st[k].n;
    var g=document.createElementNS('http://www.w3.org/2000/svg','g');
    if(k===growK) g.setAttribute('class','grow');
    var h=22+Math.max(0,Math.min(1,(n-MILES.settle)/(MILES.bloom-MILES.settle)))*96;
    g.innerHTML=plantMarkup(k,x,b,n)+'<rect class="hit" x="'+(x-28)+'" y="'+(b-h-24)+'" width="56" height="'+(h+40)+'" rx="10"/>';
    psvg.appendChild(g);
    bindPlantPress(g.querySelector('.hit'),k);
  });
}
function bloomArt(k){

  }

});

/* real-device gravity (iPhone needs a tap to grant motion access) */
var devG=null;
var iOS=/iP(hone|ad|od)/.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
function onMotion(e){
  var a=e.accelerationIncludingGravity; if(!a || a.x==null) return;
  var k=0.1/9.8, sx=iOS?1:-1;
  devG={ x:sx*a.x*k, y:-sx*a.y*k };
}
var gotMotion=false;
function startMotion(){
  window.addEventListener('devicemotion',function(e){ gotMotion=true; onMotion(e); });
  setTimeout(function(){
    if(!gotMotion) toast('センサーの信号が届かない（表示している枠が遮断している可能性）');
    else toast('重力センサー ON — 端末を傾けてみて');
  },1500);
}
var asked=false;
function askMotion(){
  if(asked) return; asked=true;
  DeviceMotionEvent.requestPermission().then(function(r){
    if(r==='granted'){ startMotion(); $('sens').hidden=true; }
    else { asked=false; toast('センサーが許可されなかった'); }
  }).catch(function(err){ asked=false; toast('センサーを要求できない：'+((err&&err.name)||'error')); });
}
if(mobile){
  if(window.DeviceMotionEvent && typeof DeviceMotionEvent.requestPermission==='function'){
    var sens=$('sens'); sens.hidden=false;
    sens.addEventListener('click',askMotion);
    screen.addEventListener('click',function once(){ screen.removeEventListener('click',once); askMotion(); });
    setTimeout(function(){ toast('画面をタップすると重力センサーの許可を求めます'); },1000);
  } else if(window.DeviceMotionEvent){ startMotion(); }
  else setTimeout(function(){ toast('この端末・ブラウザは重力センサー非対応'); },1000);
}

function step(t){
  if(!drag) rot+=(0-rot)*0.035;
  if(!mobile) phone.style.transform='scale('+sc+') rotate('+rot+'deg)';
  if(on){
    var W=layer.clientWidth, H=layer.clientHeight, TOP=headH(), FLOOR=H-6;
    var th=rot*Math.PI/180, G=0.05;
    var gx=devG?devG.x:Math.sin(th)*G, gy=devG?devG.y:Math.cos(th)*G;
    var B=bodies, i, j, a, b;
    for(i=0;i<B.length;i++){
      b=B[i];
      b.r+=(b.tr-b.r)*0.12;
      if(!b.drag){
        b.vx+=gx+Math.sin(t*0.0011+b.ph)*0.012;
        b.vy+=gy+Math.cos(t*0.0008+b.ph*1.7)*0.014-0.012;
        b.vx*=0.985; b.vy*=0.985;
        b.x+=b.vx; b.y+=b.vy;
      }
      if(b.x<b.r){ b.x=b.r; b.vx=Math.abs(b.vx)*0.45; }
      if(b.x>W-b.r){ b.x=W-b.r; b.vx=-Math.abs(b.vx)*0.45; }
      if(b.y<TOP+b.r){ b.y=TOP+b.r; b.vy=Math.abs(b.vy)*0.4; }
      if(b.y>FLOOR-b.r){ b.y=FLOOR-b.r; b.vy=-Math.abs(b.vy)*0.5; b.vx*=0.94; }
    }
    for(i=0;i<B.length;i++) for(j=i+1;j<B.length;j++){
      a=B[i]; b=B[j];
      var dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||0.01, m=a.r+b.r;
      if(d<m){
        var nx=dx/d, ny=dy/d, o=(m-d)/2;
        if(!a.drag){ a.x-=nx*o; a.y-=ny*o; } if(!b.drag){ b.x+=nx*o; b.y+=ny*o; }
        var rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
        if(rv<0){ var k=-rv*0.7; a.vx-=nx*k; a.vy-=ny*k; b.vx+=nx*k; b.vy+=ny*k; }
      }
    }
    for(i=0;i<B.length;i++){
      b=B[i];
      b.el.style.width=b.el.style.height=(b.r*2)+'px';
      b.el.style.transform='translate('+(b.x-b.r)+'px,'+(b.y-b.r)+'px) rotate('+(b.vx*6)+'deg)';
    }
  }
  requestAnimationFrame(step);
}
requestAnimationFrame(step);

function local(cx,cy){
  var r=layer.getBoundingClientRect();
  var dx=(cx-(r.left+r.width/2))/sc, dy=(cy-(r.top+r.height/2))/sc, th=-rot*Math.PI/180;
  return { x:dx*Math.cos(th)-dy*Math.sin(th)+layer.clientWidth/2, y:dx*Math.sin(th)+dy*Math.cos(th)+layer.clientHeight/2 };
}
function localDelta(dx,dy){
  var th=-rot*Math.PI/180; dx/=sc; dy/=sc;
  return { x:dx*Math.cos(th)-dy*Math.sin(th), y:dx*Math.sin(th)+dy*Math.cos(th) };
}

/* ======================= seeds ======================= */
function seedOf(k){ for(var i=0;i<bodies.length;i++) if(bodies[i].type===k) return bodies[i]; return null; }
function makeSeed(k,x,y){
  var el=document.createElement('div');
  el.style.cssText='position:absolute;left:0;top:0;will-change:transform;pointer-events:auto;cursor:grab;touch-action:none;';
  var inner=document.createElement('div'); inner.style.cssText='width:100%;height:100%;';
  el.appendChild(inner); layer.appendChild(el);
  var b={ type:k, x:x, y:Math.max(y,headH()+20), vx:(Math.random()-0.5)*2, vy:-2.5, r:4, tr:SEED_R[seedState(Math.max(1,st[k].n))], el:el, inner:inner, ph:Math.random()*6.28, drag:false };
  inner.innerHTML=seedSVG(k,seedState(Math.max(1,st[k].n)));
  bodies.push(b); bindDrag(b);
  return b;
}
function refreshSeed(k,pop){
  var b=seedOf(k); if(!b) return;
  var s=seedState(st[k].n);
  b.tr=SEED_R[s]; b.inner.innerHTML=seedSVG(k,s);
  if(pop){ b.vy-=1.5; b.inner.animate([{transform:'scale(.8)'},{transform:'scale(1.12)'},{transform:'scale(1)'}],{duration:420,easing:'ease-out'}); }
}
function bindDrag(b){
  b.el.addEventListener('pointerdown',function(e){
    e.stopPropagation(); e.preventDefault();
    b.drag=true; b.px=e.clientX; b.py=e.clientY; b.x0=e.clientX; b.y0=e.clientY; b.el.setPointerCapture(e.pointerId); b.el.style.cursor='grabbing';
    clearTimeout(b.lp);
    b.lp=setTimeout(function(){
      b.drag=false; b.el.style.cursor='grab';
      if(navigator.vibrate) navigator.vibrate(20); beep([440]);
      b.inner.animate([{transform:'scale(1)'},{transform:'scale(1.18)'},{transform:'scale(1)'}],{duration:320,easing:'ease-out'});
      openSheet(b.type);
    },500);
  });
  b.el.addEventListener('pointermove',function(e){
    if(!b.drag) return;
    if(Math.hypot(e.clientX-b.x0,e.clientY-b.y0)>8) clearTimeout(b.lp);
    var d=localDelta(e.clientX-b.px,e.clientY-b.py); b.px=e.clientX; b.py=e.clientY;
    b.x+=d.x; b.y+=d.y; b.vx=d.x*0.5; b.vy=d.y*0.5;
  });
  function end(){ clearTimeout(b.lp); b.drag=false; b.el.style.cursor='grab'; }
  b.el.addEventListener('pointerup',end); b.el.addEventListener('pointercancel',end);
}

/* ======================= long press on a post ======================= */
function onDown(post,e){
  if(!on||press) return;
  if(e.target.closest('.like,.nl')) return;
  var p=local(e.clientX,e.clientY);
  var ring=document.createElement('div');
  ring.style.cssText='position:absolute;left:'+(p.x-26)+'px;top:'+(p.y-26)+'px;width:52px;height:52px;border-radius:50%;border:2px solid var(--color-accent);pointer-events:none;';
  layer.appendChild(ring);
  ring.animate([{transform:'scale(.2)',opacity:0},{transform:'scale(1)',opacity:1}],{duration:500,easing:'ease-out',fill:'forwards'});
  press={ post:post, p:p, ring:ring, x0:e.clientX, y0:e.clientY, t:setTimeout(fire,500) };
}
function cancel(){
  var pr=press; if(!pr) return;
  clearTimeout(pr.t); press=null;
  pr.ring.animate([{opacity:1},{opacity:0}],{duration:180,fill:'forwards'}).onfinish=function(){ pr.ring.remove(); };
}
[fScroll,fNote].forEach(function(f){
  f.addEventListener('pointerdown',function(e){ var post=e.target.closest('[data-id]'); if(post) onDown(post,e); });
  f.addEventListener('pointermove',function(e){ if(press&&Math.hypot(e.clientX-press.x0,e.clientY-press.y0)>8) cancel(); });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){ f.addEventListener(ev,cancel); });
  f.addEventListener('contextmenu',function(e){ e.preventDefault(); });
  f.addEventListener('scroll',function(){
    var d=f.scrollTop-(f._ls||0); f._ls=f.scrollTop; var k=Math.max(-3,Math.min(3,d*0.04));
    bodies.forEach(function(b){ if(!b.drag){ b.vy+=k*0.4; b.vx+=(Math.random()-0.5)*Math.abs(k)*0.5; } });
  },{passive:true});
});

function beep(freqs){
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    var t=ac.currentTime;
    freqs.forEach(function(f,k){
      var o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=f;
      g.gain.setValueAtTime(0,t+k*0.09); g.gain.linearRampToValueAtTime(0.12,t+k*0.09+0.01); g.gain.exponentialRampToValueAtTime(0.001,t+k*0.09+0.25);
      o.connect(g); g.connect(ac.destination); o.start(t+k*0.09); o.stop(t+k*0.09+0.3);
    });
  }catch(err){}
}

function fire(){
  var pr=press; if(!pr) return;
  press=null; pr.ring.remove();
  var id=pr.post.dataset.id, k=pr.post.dataset.k;
  if(seen[id]){
    var r=document.createElement('div');
    r.style.cssText='position:absolute;left:'+(pr.p.x-26)+'px;top:'+(pr.p.y-26)+'px;width:52px;height:52px;border-radius:50%;border:2px solid color-mix(in srgb,var(--color-text) 40%,transparent);';
    layer.appendChild(r);
    r.animate([{transform:'translateX(0)'},{transform:'translateX(-5px)'},{transform:'translateX(5px)'},{transform:'translateX(0)',opacity:0}],{duration:360}).onfinish=function(){ r.remove(); };
    toast('この投稿からはもう種が出ている');
    return;
  }
  seen[id]=true; pr.post.classList.add('seen-mark');
  if(navigator.vibrate) navigator.vibrate(35);
  if(!st[k].settled && !seedOf(k)){
    st[k].n+=1; makeSeed(k,pr.p.x,pr.p.y); beep([660]);
    after(k,'種が生まれた（'+CAT[k].jp+'）');
    return;
  }
  flyDot(k,pr.p.x,pr.p.y,function(){ st[k].n+=1; after(k,null,true); });
}
function flyDot(k,x,y,done){
  var tx,ty;
  if(st[k].settled){ tx=slotX(k); ty=plantTopY(k); } else { var b=seedOf(k); tx=b.x; ty=b.y; }
  var dot=document.createElement('div');
  dot.style.cssText='position:absolute;left:0;top:0;width:14px;height:14px;border-radius:50%;background:'+col(k)+';';
  layer.appendChild(dot);
  dot.animate([{transform:'translate('+(x-7)+'px,'+(y-7)+'px) scale(1.4)'},{transform:'translate('+(tx-7)+'px,'+(ty-7)+'px) scale(.4)'}],{duration:520,easing:'cubic-bezier(.5,0,.3,1)'}).onfinish=function(){ dot.remove(); done(); };
}

/* likes = +1 (v1.2) */
function likePost(btn){
  var post=btn.closest('[data-id]'), id=post.dataset.id, k=post.dataset.k;
  if(liked[id]){ liked[id]=false; btn.setAttribute('aria-pressed','false'); return; }
  liked[id]=true; btn.setAttribute('aria-pressed','true');
  if(!on){ st[k].n+=1; after(k,'関心 +1（'+CAT[k].jp+'）'); return; }
  if(!st[k].settled && !seedOf(k)){ var r=btn.getBoundingClientRect(), p=local(r.left+r.width/2,r.top); st[k].n+=1; makeSeed(k,p.x,p.y); beep([660]); after(k,'関心 +1（'+CAT[k].jp+'）'); return; }
  var rr=btn.getBoundingClientRect(), pp=local(rr.left+rr.width/2,rr.top+rr.height/2);
  flyDot(k,pp.x,pp.y,function(){ st[k].n+=1; after(k,'関心 +1（'+CAT[k].jp+'）',true); });
}
fScroll.addEventListener('click',function(e){ var b=e.target.closest('.like'); if(b) likePost(b); });
fNote.addEventListener('click',function(e){ var b=e.target.closest('.nl'); if(b) likePost(b); });

/* ======================= growth (v1.2 milestones) ======================= */
function after(k,msg,pop){
  var s=st[k], c=CAT[k];
  if(msg) toast(msg);
  if(!s.settled && s.n>=MILES.settle){
    s.settled=true;
    var b=seedOf(k);
    if(b){
      b.el.animate([{opacity:1},{opacity:0}],{duration:360,fill:'forwards'}).onfinish=function(){ b.el.remove(); };
      bodies=bodies.filter(function(x){ return x!==b; });
    }
    if(slots.indexOf(k)<0) slots.push(k);
    beep([587,784]); if(navigator.vibrate) navigator.vibrate([12,40,12]);
    setTimeout(function(){ toast(c.jp+' 定着（5 件）— 根を張った'); },500);
    drawPlants(k);
  } else if(s.settled){
    drawPlants(pop?k:null);
    if(pop) beep([660+Math.min(8,stageIdx(s.n))*40]);
  } else {
    refreshSeed(k,pop);
    if(pop) beep([660+seedState(s.n)*60]);
  }
  if(s.n===MILES.leaf) setTimeout(function(){ toast(c.jp+' 葉が開いた（6 件）'); },500);
  if(s.n===MILES.bud) setTimeout(function(){ toast(c.jp+' 蕾（9 件）'); },500);
  if(s.n===MILES.half) setTimeout(function(){ toast(c.jp+' 半開（12 件）'); },500);
  if(s.n>=MILES.bloom && !s.popped && !s.optout){
    s.popped=true; beep([523,659,784]); if(navigator.vibrate) navigator.vibrate([12,40,12]);
    setTimeout(function(){ showBloom(k); },800);
  }
  renderProg();
}

/* ======================= interest sheet (seed / plant long press) ======================= */
function bindPlantPress(el,k){
  var tm=null;
  el.addEventListener('pointerdown',function(e){ e.stopPropagation(); tm=setTimeout(function(){ if(navigator.vibrate) navigator.vibrate(20); beep([440]); openSheet(k); },500); });
  ['pointerup','pointerleave','pointercancel'].forEach(function(ev){ el.addEventListener(ev,function(){ clearTimeout(tm); }); });
}
var pages=$('pages'), sheetEl=$('sheet');
function showPage(n,smooth){
  pages.scrollTo({left:n*pages.clientWidth,behavior:smooth?'smooth':'auto'});
  markPage(n);
}
function markPage(n){
  sheetEl.querySelectorAll('.tabs button').forEach(function(b){ b.setAttribute('aria-selected',+b.dataset.pg===n?'true':'false'); });
  sheetEl.querySelectorAll('.pgdots i').forEach(function(d,i){ d.classList.toggle('on',i===n); });
}
pages.addEventListener('scroll',function(){ markPage(Math.round(pages.scrollLeft/Math.max(1,pages.clientWidth))); },{passive:true});
sheetEl.querySelector('.tabs').addEventListener('click',function(e){ var b=e.target.closest('[data-pg]'); if(b) showPage(+b.dataset.pg,true); });

function openSheet(k){
  var c=CAT[k], s=st[k], st1=Math.max(1,Math.min(3,seedState(Math.max(1,s.n))));
  var rec=$('pgRec'); rec.textContent='';
  var head=document.createElement('div'); head.className='ihead';
  head.innerHTML='<span class="sd">'+seedSVG(k,st1)+'</span><span><b>'+c.jp+'</b><span>'+c.plant+' · '+STAGE_JP[stageIdx(s.n)]+' · '+s.n+' 件　<i style="font-family:\'Source Serif 4\',serif">'+c.lat+'</i></span></span>';
  rec.appendChild(head);
  var items=[];
  SCROLL.forEach(function(p,i){ if(p[0]===k) items.push({t:p[2],a:p[1],l:p[3],seen:!!seen['s'+i]}); });
  NOTES.forEach(function(p,i){ if(p[0]===k) items.push({t:p[1],a:p[2],l:p[3],seen:!!seen['n'+i]}); });
  items.sort(function(a,b){ return (a.seen?1:0)-(b.seen?1:0); });
  items.slice(0,10).forEach(function(it){
    var r=document.createElement('div'); r.className='rec';
    r.innerHTML='<span class="th halftone"></span><span><b>'+it.t+'</b><small>'+it.a+' · ♡ '+it.l+(it.seen?' · 種にした':'')+'</small></span>';
    r.addEventListener('click',function(){ toast('投稿を開く（デモはここまで）'); });
    rec.appendChild(r);
  });
  var colp=$('pgCol'); colp.textContent='';
  KEYS.forEach(function(q){
    var cq=CAT[q], sq=st[q];
    var row=document.createElement('div'); row.className='srow';
    row.innerHTML='<span class="sd'+(sq.n?'':' dim')+'">'+seedSVG(q,Math.max(1,Math.min(3,seedState(Math.max(1,sq.n)))))+'</span>'+
      '<span><b style="color:'+(q===k?col(q):'inherit')+'">'+cq.jp+' · '+cq.form+'</b><small>'+cq.lat+' · '+sq.n+' 件</small></span><span class="st">'+STAGE_JP[stageIdx(sq.n)]+'</span>';
    colp.appendChild(row);
  });
  setDrop(false);
  sheetEl.setAttribute('data-on','1');
  requestAnimationFrame(function(){ showPage(0,false); });
}
$('sheetX').addEventListener('click',function(){ sheetEl.setAttribute('data-on','0'); });

/* ======================= bloom card ======================= */
var bloomK=null;
function showBloom(k){
  var c=CAT[k]; bloomK=k;
  $('bloomArt').innerHTML=bloomArt(k);
  $('bH').textContent=c.plant+'が咲いた · '+c.jp+' を 15 件見た';
  $('bS').textContent='近くで、やってみる';
  var ul=$('bList'); ul.textContent='';
  c.shops.forEach(function(r){ var li=document.createElement('li'); li.innerHTML='<span>'+r[0]+'</span><small>'+r[1]+'</small>'; ul.appendChild(li); });
  $('bloom').hidden=false;
}
$('bX').addEventListener('click',function(){ $('bloom').hidden=true; });
$('bGo').addEventListener('click',function(){ toast('→ 予約画面へ（demo はここまで）'); });
$('bOff').addEventListener('click',function(){ if(bloomK) st[bloomK].optout=true; $('bloom').hidden=true; toast('入口を OFF にした（植物はそのまま育つ）'); });

/* ======================= seed mode ======================= */
$('tog').addEventListener('click',function(){
  on=!on;
  this.setAttribute('aria-pressed',on?'true':'false');
  $('togl').textContent=on?'種 · ON':'種 · OFF';
  layer.style.opacity=on?1:0; psvg.style.opacity=on?1:0;
  if(!on) cancel();
  toast(on?'種モード ON':'種モード OFF（蓄積は続く）');
});

/* ======================= app switch ======================= */
function setApp(m){
  app=m;
  $('aScroll').setAttribute('aria-pressed',m==='scroll'?'true':'false');
  $('aNote').setAttribute('aria-pressed',m==='note'?'true':'false');
  fScroll.hidden=m!=='scroll'; fNote.hidden=m!=='note';
  drop.querySelectorAll('[data-app]').forEach(function(b){ b.setAttribute('aria-pressed',b.getAttribute('data-app')===m?'true':'false'); });
  $('appTitle').textContent=m==='scroll'?'ホーム':'発見';
  cancel();
}
$('aScroll').addEventListener('click',function(){ setApp('scroll'); });
$('aNote').addEventListener('click',function(){ setApp('note'); });

/* ======================= tilt: drag the bezel, eases back on release (Claude Design) ======================= */
function center(){ var r=phone.getBoundingClientRect(); return { x:r.left+r.width/2, y:r.top+r.height/2 }; }
wrap.addEventListener('pointerdown',function(e){
  if(e.target!==wrap && e.target!==box && e.target!==phone) return;
  var c=center();
  drag={ a0:Math.atan2(e.clientY-c.y,e.clientX-c.x), r0:rot, c:c };
  wrap.setPointerCapture(e.pointerId); wrap.style.cursor='grabbing';
});
wrap.addEventListener('pointermove',function(e){
  if(!drag) return;
  var d=(Math.atan2(e.clientY-drag.c.y,e.clientX-drag.c.x)-drag.a0)*180/Math.PI;
  if(d>180) d-=360; if(d<-180) d+=360;
  rot=Math.max(-75,Math.min(75,drag.r0+d));
});
function endDrag(){ if(!drag) return; drag=null; wrap.style.cursor='grab'; }
wrap.addEventListener('pointerup',endDrag); wrap.addEventListener('pointercancel',endDrag);

/* ======================= version menu ======================= */
if(0)$('ver').addEventListener('change',function(){ var v=this.value; if(v==='1.3.1'){ location.href='v1-3-1.html'; return; } if(v==='1.3'){ location.href='v1-3.html'; return; } if(v!=='1.3.2') location.href='legacy.html?v='+v; });
})();
